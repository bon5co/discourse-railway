# Public sign-up is closed at the edge as well as in the settings. Discourse answers an anonymous sign-up POST with HTTP 200 and a
# decoy "activation mail sent" body (a honeypot for bots), so a status code cannot show the form is shut. A POST to the account
# creation routes without an Api-Key header is refused here; an administrator's API key, invitations and SSO use other paths or
# carry the header and still work.
set $railway_signup "$request_method:$uri:$http_api_key";
if ($railway_signup ~ "^POST:/(u|users)(\.json)?/?:$") { return 403; }
